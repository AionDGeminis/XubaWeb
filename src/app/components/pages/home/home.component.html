  <div class="col-sm-12" style="background: var(--bg);" *ngIf="currentHomeIndex === 0">
    <app-loader *ngIf="loading"></app-loader>
    <div class="col-sm-12">
      <app-xpress-auctions (abrirDetalle)="abrirDetalle($event)"></app-xpress-auctions>
    </div>
    <div class="col-sm-12">
      <app-premium-auctions (abrirDetalle)="abrirDetalle($event)"></app-premium-auctions>
      <br>
    </div>
    <div class="col-sm-12">
      <app-search-auctions *ngIf="terminoBusqueda" [terminoBusqueda]="terminoBusqueda"
        (abrirDetalle)="abrirDetalle($event)"></app-search-auctions>
      <app-general-auctions *ngIf="!terminoBusqueda" (abrirDetalle)="abrirDetalle($event)"></app-general-auctions>
    </div>
  </div>
  <div class="col-sm-10" *ngIf="currentHomeIndex === 1">
    <app-loader *ngIf="loading"></app-loader>
    <div class="col-sm-12 mt-3">
      <app-search-auctions [tipoSeccion]="'SubastasPremium'" *ngIf="terminoBusqueda" [terminoBusqueda]="terminoBusqueda"
        (abrirDetalle)="abrirDetalle($event)"></app-search-auctions>
      <app-general-auctions [tipoSeccion]="'SubastasPremium'" *ngIf="!terminoBusqueda"

  </div>
  <div class="col-sm-10" *ngIf="currentHomeIndex === 2">
    <app-loader *ngIf="loading"></app-loader>
    <div class="col-sm-12 mt-3">
      <app-search-auctions [tipoSeccion]="'SubastasExpress'" *ngIf="terminoBusqueda" [terminoBusqueda]="terminoBusqueda"

      <app-general-auctions [tipoSeccion]="'SubastasExpress'" *ngIf="!terminoBusqueda"

<!-- MODAL ENVIAR CORREO CAMBIO PASSWORD -->

<div *ngIf="openModalResetPassword" class="cart-modal-backdrop">
  <div class="cart-modal-container" (click)="onContentClick($event)">
    <div class="modal-header bg-main-header text-white">
      <h3 class="modal-title">
        <!-- <i class="fas fa-shopping-cart "></i> -->
        <span class="text-white">Reestablecer contraseña</span>
      </h3>
      <button class="close-button" (click)="closeModal()">
        <span class="text-white">&times;</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="policy-content px-2 py-3">
        <form class="form-producto">
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Ingresa el correo registrado</label>
              <input type="text" [(ngModel)]="validRegisteredMail" id="correo" name="correo" />
            </div>

          </div>
          <div class="form-row">
            <div class="form-group">
              <button class="btn btn-info2" (click)="checkDataForChangePassword()">
                Enviar enlace
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <div class="modal-footer text-start">

      <!-- Botones para el paso del carrito -->
      <div>
        <button class="btn btn-dark" (click)="closeModal()">
          Cerrar
        </button>
        <!-- <button class="btn btn-success btn-add-cart"  (click)="nextStep()">
         
        </button> -->
      </div>
    </div>
    <!-- </div> -->
  </div>
</div>
<div class="modal-contacto" *ngIf="mostrarmodalcontacto" (click)="cerrarmodalcontacto()">

  <div class="modal-contacto-contenido" (click)="$event.stopPropagation()">

    <!-- ENCABEZADO -->
    <div class="modal-contacto-header">

      <h5>
        Información de contacto
      </h5>

      <button type="button" class="btn-close" (click)="cerrarmodalcontacto()">
      </button>

    </div>

    <div class="contacto-item">

      <div class="contacto-titulo">
        <i class="fas fa-map-marker-alt"></i>
        Dirección
      </div>

      <div class="contacto-dato">
        Cd. Juarez, Chihuahua, Mexico<br>
        candelilla #9314, Infonavit ampliación<br>
        aeropuerto 32665
      </div>

    </div>

    <!-- TELÉFONO -->
    <div class="contacto-item">

      <div class="contacto-titulo">
        <i class="fas fa-phone-alt"></i>
        Telefono
      </div>

      <div class="contacto-dato">
        6564185727
      </div>

    </div>


    <div class="contacto-item">

      <div class="contacto-titulo">
        <i class="fas fa-envelope"></i>
        Correo
      </div>

      <div class="contacto-dato">
        soporte&#64;xuba.mx
      </div>

    </div>

  </div>

</div>
