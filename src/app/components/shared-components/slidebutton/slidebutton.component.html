<div #track class="slide-track" [class.slide-confirmed]="confirmedFlag" [class.slide-disabled]="disabled">
    <div #fill class="slide-fill"></div>

    <span #label class="slide-label"></span>

    <span #thumb class="slide-thumb" role="slider" tabindex="0" [attr.aria-label]="label" [attr.aria-valuemin]="0"
        [attr.aria-valuemax]="100" aria-valuenow="0" (keydown)="onKeyDown($event)">
        <svg class="slide-icon slide-icon-gavel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8" />
            <path d="m16 16 6-6" />
            <path d="m8 8 6-6" />
            <path d="m9 7 8 8" />
            <path d="m21 11-8-8" />
        </svg>

        <svg class="slide-icon slide-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
        </svg>
    </span>
</div>
